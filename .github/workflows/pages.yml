# Publie le site sur GitHub Pages à chaque push.
#
# Runner Ubuntu : il compte x1 dans le quota, contre x10 pour le runner macOS de
# l'IPA. Un déploiement coûte donc une poignée de minutes, et peut partir à chaque
# push sans entamer le forfait.
#
# `base: './'` dans vite.config.js produit des chemins relatifs : le site fonctionne
# tel quel sous une URL en sous-dossier, du type /unydex/.

name: Site en ligne

on:
  workflow_dispatch:
  push:
    branches: [main]

# Droits exigés par le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées rapprochées annulent la précédente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Produit dist/ ET dist/sw.js, la coquille du service worker.
      # Configuration Supabase, lue par vite.config.js au moment du build. Le .env
      # n'étant pas versionné, sans ceci le bloc Compte n'existerait pas sur le site.
      # Ce sont des VARIABLES et non des secrets : la clé publishable part dans le
      # bundle de toute façon, c'est la sécurité au niveau des lignes qui protège.
      # Vides, elles laissent simplement l'application sans compte — elle marche.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      # Le manifeste que SideStore interroge. Il est servi PAR LE SITE et non par
      # l'URL de release : celle-ci répond 302 en text/html, avec deux redirections
      # avant le fichier, et SideStore y lisait du HTML au lieu de JSON. Pages le
      # sert en 200 direct.
      #
      # Il est bâti d'après la dernière release publiée, seule à connaître la
      # version et la taille réelles de l'IPA. Le workflow iOS relance donc ce
      # déploiement après en avoir créé une.
      - name: Écrire le manifeste de source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-source.mjs --release dist/source.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
