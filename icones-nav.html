<!doctype html>
<meta charset="utf-8">
<title>Potion — trois variantes</title>
<style>
  :root{--paper:#f6f5f1;--rule:#e3e0d6;--ink:#1e2227;--muted:#7c8592;--tint:#fff6f4;--ball:#d6453c}
  body{margin:0;padding:24px;background:#fff;font:14px ui-rounded,"Segoe UI",system-ui;color:var(--ink)}
  .var{display:flex;align-items:center;gap:24px;margin-bottom:18px;border:1px solid var(--rule);border-radius:12px;padding:14px}
  .gros{width:120px;height:120px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:10px}
  .gros svg{width:96px;height:96px}
  .txt{flex:0 0 130px}
  .nom{font-size:14px}
  .code{font-size:12px;color:var(--muted)}
  .barre{width:375px;flex:0 0 auto;background:var(--paper);border-top:1px solid var(--rule);
         display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 10px 0}
  .nb{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;
      font-size:11px;font-weight:600;color:var(--muted);padding-bottom:0}
  .nb svg{display:block;width:20px;height:20px;filter:grayscale(.45);opacity:.82}
  .nb.on{background:var(--tint);color:var(--ball)}
  .nb.on svg{filter:none;opacity:1}
</style>
