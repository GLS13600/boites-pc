         iPhone, c'était un écran vide. Six cartes, une par rareté, tournent autour d'une Poké

         fois comme une capture, se ferme dans un éclat d'étoiles, et l'écran s'ouvre sur l'appli.
         Tout est en CSS ; mouvement réduit : un simple fondu. -->
    <style>
      #lancement {
        --lc-fond: #f6f5f1; --lc-fond-2: #ebe7dc; --lc-encre: #1d2330; --lc-doux: #606977;

      .lanc-sol { position: absolute; left: 50%; top: 84%; width: 250px; height: 34px; margin-left: -125px; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / 16%), transparent); }
      [data-theme="sombre"] .lanc-sol { background: radial-gradient(closest-side, rgb(0 0 0 / 45%), transparent); }
      .lanc-monde { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-24deg); }
      /* L'enveloppe porte l'aspiration (la rotation de l'orbite, une animation, l'emporterait
         sur une transition posée sur elle). */
      .lanc-aspire {
        position: absolute; left: 50%; top: 50%; width: 0; height: 0;

         remplacé à chaque passage de la carte derrière la Ball. */

      .lanc-etape.change { animation: lancMot 340ms ease both; }

      /* Le vrai travail en cours, en petit : séries, logos, cartes classées. */
      .lanc-detail { margin: 0; min-height: 16px; font-size: 12px; font-weight: 600; color: var(--lc-doux); opacity: .75; font-variant-numeric: tabular-nums; text-align: center; }
      .lanc-barre { width: 180px; height: 5px; border-radius: 99px; background: var(--lc-piste); overflow: hidden; margin-top: 6px; }
      .lanc-barre i { display: block; height: 100%; width: calc(var(--p) * 1%); border-radius: inherit; background: var(--lc-rouge); transition: width 300ms ease; }
      .lanc-passer {
        margin-top: 18px; padding: 10px 22px; border-radius: 99px; border: 1px solid var(--lc-piste);
        background: transparent; color: var(--lc-encre); font: inherit; font-weight: 700; font-size: 15px;
        opacity: 0; transform: translateY(6px); transition: opacity 300ms ease, transform 300ms ease;
      }
      .lanc-passer.vu { opacity: 1; transform: none; }

      /* PRÊT : les cartes sont aspirées dans la Ball, qui tremble trois fois et se ferme. */
      #lancement.fin .lanc-aspire { transform: translateY(-26px) scale3d(.02, .02, .02); visibility: hidden; }
      #lancement.fin .lanc-passer { opacity: 0; pointer-events: none; }
      /* Les droits des tiers, dès l'écran de lancement (11/11/2026). */
      .lanc-mention { position: absolute; left: 24px; right: 24px; bottom: calc(env(safe-area-inset-bottom) + 14px); margin: 0;

      #lancement.fin .lanc-anneau { opacity: 0; }
      #lancement.fin .lanc-ball { animation: lancCapture 520ms ease-in-out 160ms both; }
      @keyframes lancCapture {

        54% { transform: rotate(-10deg); } 70% { transform: rotate(5deg); } 82%, 100% { transform: rotate(0); }
      }

      }

          ['#2563eb', '<path d="M12 4.6l2.1 4.5 4.9.6-3.6 3.3 1 4.8L12 15.4l-4.4 2.4 1-4.8-3.6-3.3 4.9-.6z"/>'],
          ['#7c3aed', '<path transform="matrix(.72 0 0 .72 -1.6 3.6)" d="M12 4.6l2.1 4.5 4.9.6-3.6 3.3 1 4.8L12 15.4l-4.4 2.4 1-4.8-3.6-3.3 4.9-.6z"/><path transform="matrix(.72 0 0 .72 8.3 3.6)" d="M12 4.6l2.1 4.5 4.9.6-3.6 3.3 1 4.8L12 15.4l-4.4 2.4 1-4.8-3.6-3.3 4.9-.6z"/>'],
          ['#0891b2', '<rect x="4.6" y="4.6" width="14.8" height="14.8" rx="3.6" fill="none" stroke="#0891b2" stroke-width="1.8"/><path transform="matrix(.6 0 0 .6 4.8 4.9)" d="M12 4.6l2.1 4.5 4.9.6-3.6 3.3 1 4.8L12 15.4l-4.4 2.4 1-4.8-3.6-3.3 4.9-.6z"/>'],
          ['#db2777', '<rect x="4.6" y="4.6" width="14.8" height="14.8" rx="3.6" fill="none" stroke="#db2777" stroke-width="1.8"/><path transform="matrix(.62 0 0 .62 4.56 4.56)" d="M12 4.2c.7 4.4 2.5 6.3 7.6 7.8-5.1 1.5-6.9 3.4-7.6 7.8-.7-4.4-2.5-6.3-7.6-7.8 5.1-1.5 6.9-3.4 7.6-7.8z"/>'],
          ['#c58a10', '<path d="M7.2 6.2h9.6l3 4.1L12 19.2 4.2 10.3z"/>'],
          ['#0ea5e9', '<path d="M12 4.2c.7 4.4 2.5 6.3 7.6 7.8-5.1 1.5-6.9 3.4-7.6 7.8-.7-4.4-2.5-6.3-7.6-7.8 5.1-1.5 6.9-3.4 7.6-7.8z"/>'],
          ['#16a34a', '<path d="M12 4.6 14 9l4.8.4-3.6 3.2 1.1 4.8L12 15l-4.3 2.4 1.1-4.8-3.6-3.2L10 9z" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="11.6" r="1.6"/>'],
        ];
        var cartes = [].slice.call(el.querySelectorAll('.lanc-c'));
        var art = function (id) { return 'sprites/other/official-artwork/' + id + '.webp'; };
        function tirage() {
          var t = { r: RARETES[Math.floor(Math.random() * RARETES.length)], id: 1 + Math.floor(Math.random() * 1025) };
          t.img = new Image();
          t.img.src = art(t.id);
          return t;
        }
        function pose(c, t) {
          c.style.setProperty('--c', t.r[0]);
          c.querySelector('.lanc-face svg').innerHTML = t.r[1];
          c.querySelector('.lanc-art').style.backgroundImage = 'url("' + art(t.id) + '")';
          note('carte ' + cartes.indexOf(c) + ' → n° ' + t.id);
        }
        cartes.forEach(function (c) { pose(c, tirage()); c._suivante = tirage(); c._vue = false; });
        var orbite = el.querySelector('.lanc-orbite');
        var minuteurCartes = reduit ? 0 : setInterval(function () {
          if (fini) return;
          var m;
          try { m = new DOMMatrixReadOnly(getComputedStyle(orbite).transform); } catch (e) { return; }
          // L'angle de l'orbite (rotateY) ; la carte i regarde à cet angle + i × 60°.
          var theta = Math.atan2(m.m31, m.m11);
          cartes.forEach(function (c, i) {
            var face = Math.cos(theta + i * Math.PI / 3);
            if (face > 0.3) c._vue = true;
            else if (face < -0.55 && c._vue && c._suivante.img.complete) {
              pose(c, c._suivante);
              c._suivante = tirage();
              c._vue = false;
            }
          });
        }, 160);

        function retire() { if (el.parentNode) el.parentNode.removeChild(el); }
        function part() {
          el.classList.add('part');
          note('écran parti');
          el.setAttribute('aria-busy', 'false');
          setTimeout(retire, 340);
        }
        // La pub d'ouverture (pubs.js, branchée par main.js sur `avantDepart`) se pose SUR
        // l'écran, qui ne part qu'à sa fermeture : Google la veut sur l'écran de chargement,
        // pas sur l'appli. Sans pub, l'écran part aussitôt.
        function avantDepart(suite) {
          var f = api.avantDepart;
          if (typeof f !== 'function') return suite();
          note('pub d’ouverture ?');
          var p;
          try { p = f(); } catch (e) { return suite(); }
          Promise.resolve(p).then(function (vue) { note(vue ? 'pub fermée' : 'pas de pub'); suite(); }, suite);
        }
        var api = {
          detail: function (txt) { if (!fini && txt !== detail.textContent) { detail.textContent = txt || ''; note('· ' + txt); } },
          etape: function (txt) { api.detail(txt); },
          progres: function (p) { el.style.setProperty('--p', Math.max(0, Math.min(100, Math.round(p * 100)))); },
          // `vite` : on saute la capture (« Continuer »).
          fin: function (txt, vite) {
            if (fini) return;
            fini = true;
            clearInterval(minuteurMots);
            clearInterval(minuteurCartes);
            api.progres(1);
            if (txt) dit(txt);
            detail.textContent = '';
            if (vite) { part(); return; }
            if (reduit) { avantDepart(part); return; }
            // La rotation se voit au moins un instant, puis la capture.
            var attente = Math.max(0, 800 - (performance.now() - t0));
            setTimeout(function () {
              el.classList.add('fin');
              setTimeout(function () { el.classList.add('clic'); }, 680);
              setTimeout(function () { avantDepart(part); }, 930);
            }, attente);
          },
          montreContinuer: function () {
            if (fini) return;
            passer.hidden = false;
            requestAnimationFrame(function () { passer.classList.add('vu'); });
          },
        };
        passer.addEventListener('click', function () { api.fin(null, true); });
        setTimeout(api.montreContinuer, 4000);
        window.__lancement = api;
      })();
    </script>
    <div id="app"></div>
  </body>
