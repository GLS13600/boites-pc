# Publie le site sur GitHub Pages à chaque push.
#
# Runner Ubuntu : il compte x1 dans le quota, contre x10 pour le runner macOS de
# l'IPA. Un déploiement coûte donc une poignée de minutes, et peut partir à chaque
# push sans entamer le forfait.
#
# `base: './'` dans vite.config.js produit des chemins relatifs : le site fonctionne
# tel quel sous une URL en sous-dossier, du type /guiguidex/.

name: Site en ligne

on:
  workflow_dispatch:
  push:
    branches: [main]

# Droits exigés par le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées rapprochées annulent la précédente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Produit dist/ ET dist/sw.js, la coquille du service worker.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
