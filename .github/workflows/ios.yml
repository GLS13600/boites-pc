# Produit un IPA NON SIGNÉ et le publie en release GitHub, avec le manifeste de
# source que SideStore interroge pour proposer la mise à jour SANS CÂBLE.
#
# C'est SideStore (ou Sideloadly) qui signera ensuite avec l'Apple ID personnel :
# rien n'est signé ici, aucun secret n'est nécessaire.
#
# Capacitor 8 utilise Swift Package Manager, pas CocoaPods : on compile donc
# App.xcodeproj directement, et non un App.xcworkspace qui n'existe pas.

name: IPA non signé

# Compilé À CHAQUE PUSH sur main. Le dépôt étant PUBLIC, les runners standard —
# macOS compris — ne consomment aucun quota : le multiplicateur x10 ne vaut que
# pour les dépôts privés. Repasser le dépôt en privé rendrait ce déclencheur
# coûteux, il faudrait alors revenir au lancement manuel.
on:
  push:
    branches: [main]
    # Une modification de documentation ne change pas l'application : inutile de
    # mobiliser un runner macOS 15 minutes et de publier une release pour ça.
    paths-ignore:
      - '**.md'
      - 'reference/**'
      - 'calage.html'
      - 'icone.html'
      - 'icones-nav.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Deux poussées rapprochées ne doivent pas produire deux IPA concurrents : seule
# la plus récente compte, on annule celle qui est déjà en cours.
concurrency:
  group: ios
  cancel-in-progress: true

# `contents` pour créer la release, `actions` pour relancer ensuite le workflow
# Pages, qui republie le manifeste de source.
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Une version par exécution, strictement croissante : c'est ce que SideStore
      # compare à la version installée pour décider s'il y a une mise à jour.
      # Sans incrément, un nouveau build passerait inaperçu.
      - name: Numéroter la version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # Package.swift référence node_modules/@capacitor/haptics en chemin relatif :
      # les dépendances doivent être installées avant d'ouvrir le projet Xcode.
      - run: npm ci

      # APP_VERSION est lu par vite.config.js : le numéro affiché dans l'application
      # est donc exactement celui du manifeste et de l'IPA.
      - run: npm run build

      # Recopie dist/ dans ios/App/App/public et met à jour la liste des plugins.
      - run: npx cap sync ios

      - name: Archiver sans signature
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            archive

      # Un IPA n'est qu'une archive zip contenant un dossier Payload/.
      - name: Fabriquer l'IPA
        working-directory: ios/App/build
        run: |
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qry Guiguidex.ipa Payload
          ls -lh Guiguidex.ipa

      - name: Écrire le manifeste de source
        run: node scripts/build-source.mjs ios/App/build/Guiguidex.ipa "$APP_VERSION" ios/App/build/source.json

      # L'IPA et le manifeste sont attachés à la MÊME release : l'URL
      # releases/latest/download/ pointera donc toujours sur le couple cohérent.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `run_number` ne change pas quand on RELANCE une exécution : sans cette
          # suppression, `gh release create` échouerait sur un tag déjà pris.
          gh release delete "v$APP_VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$APP_VERSION" \
            ios/App/build/Guiguidex.ipa \
            ios/App/build/source.json \
            --title "Guiguidex $APP_VERSION" \
            --notes "Build automatique $APP_VERSION. À installer par SideStore via la source, ou manuellement avec Sideloadly."

      # Doublon volontaire : l'artefact reste disponible même si la release est
      # supprimée, et sert de repli pour une installation au câble.
      - uses: actions/upload-artifact@v4
        with:
          name: Guiguidex-ipa
          path: ios/App/build/Guiguidex.ipa
          retention-days: 30

      # Le manifeste servi par le site est bâti d'après la DERNIÈRE release : il
      # faut redéployer Pages maintenant qu'elle existe, sinon il resterait une
      # version en arrière jusqu'à la poussée suivante.
      - name: Republier le manifeste sur le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
